openapi: 3.0.3
info:
  title: Portal Backend — TOTP Authenticator Login API
  version: 1.0.0
  description: |
    TOTP MFA login APIs under /v1/mfa.

    No Bearer on these calls. validateLogin returns session id — send id + email on later steps.
    On success you get accessToken for other portal APIs.

    Enrolled: validateLogin → totp/verify
    First enroll: validateLogin → verifyOTP → totp/verify-setup

    Rate limits (IP): LOGIN 5/5s block 300s · RETRY 20/60s block 120s

security: []

servers:
  - url: https://api.denovosystem.tech/v1/mfa
    description: Dev API (api.denovosystem.tech)
  - url: https://api.denovosystem.net/v1/mfa
    description: QA API (api.denovosystem.net)

tags:
  - name: 1. Password
    description: Start login — password check and MFA branch
  - name: 2. Email OTP
    description: Enrollment / legacy email OTP
  - name: 3. Authenticator
    description: TOTP verify or setup — issues JWT

paths:
  /validateLogin:
    post:
      tags: [1. Password]
      security: []
      summary: Validate password and start MFA
      description: Returns session id. Next is totp/verify (enrolled) or verifyOTP (enroll).
      operationId: mfaValidateLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateLoginRequest'
            examples:
              basic:
                summary: Typical portal login body
                value:
                  email: user@example.com
                  password: "<AES-encrypted-password>"
                  version: "1"
                  captchaToken: ""
                  fingerPrintData:
                    browserVersion: "120.0"
                    browserName: "Chrome"
                    userAgent: "Mozilla/5.0"
                    screenResolution: "1920x1080"
                    cookies: true
                    timeZone: "Asia/Kolkata"
                    plugIn: ""
      responses:
        '200':
          description: Password OK — check response flags for next step
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TotpVerificationRequiredResponse'
                  - $ref: '#/components/schemas/TotpEnrollmentRequiredResponse'
                  - $ref: '#/components/schemas/LegacyMfaRequiredResponse'
                  - $ref: '#/components/schemas/LoginSuccessResponse'
              examples:
                enrolled:
                  summary: Go to authenticator verify
                  value:
                    totpVerificationRequired: true
                    mfaRequired: true
                    mfa: true
                    id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                    email: user@example.com
                    userType: SYSTEM
                    isTermsCheck: false
                enroll:
                  summary: Go to email OTP then QR setup
                  value:
                    totpEnrollmentRequired: true
                    mfaRequired: true
                    mfa: true
                    id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                    email: user@example.com
                    userType: SYSTEM
                    isTermsCheck: false
        '401':
          description: Bad password or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '426':
          description: Client version upgrade required
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: TOTP service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /resendOTP:
    post:
      tags: [2. Email OTP]
      security: []
      summary: Resend email OTP
      description: Body needs id + email from validateLogin.
      operationId: mfaResendOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: New OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP sent successfully !
                  toaster_type:
                    type: string
                additionalProperties: true
        '400':
          description: No session available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /verifyOTP:
    post:
      tags: [2. Email OTP]
      security: []
      summary: Verify email OTP
      description: Enroll returns QR (totpSetup). Legacy may return JWT. Body id + email + otp.
      operationId: mfaVerifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            examples:
              enrollEmailOtp:
                summary: Email OTP during TOTP enroll
                value:
                  id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                  email: user@example.com
                  otp: "123456"
                  isTermsCheck: false
                  UserRoleType: SYSTEM
      responses:
        '200':
          description: OTP accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TotpEnrollmentPendingResponse'
                  - $ref: '#/components/schemas/LoginSuccessResponse'
              examples:
                qrReady:
                  summary: Continue to authenticator setup
                  value:
                    emailOtpVerified: true
                    totpEnrollmentPending: true
                    id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                    email: user@example.com
                    userType: SYSTEM
                    totpSetup:
                      qrCode: "data:image/png;base64,..."
                      manualEntryKey: "RHLE4ALPJGWEVEVSULH7I2GZDMJCJMNU"
                      otpauthUrl: "otpauth://totp/..."
        '400':
          description: Invalid OTP or setup failed
        '401':
          description: Terms required (legacy)
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /totp/verify:
    post:
      tags: [3. Authenticator]
      security: []
      summary: Verify TOTP (enrolled) and get JWT
      description: Body id + email + 6-digit code. Optional terms fields.
      operationId: totpVerifyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            examples:
              withTerms:
                value:
                  id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                  email: user@example.com
                  code: "482193"
                  isTermsCheck: true
                  UserRoleType: SYSTEM
              withoutTerms:
                value:
                  id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                  email: user@example.com
                  code: "482193"
                  isTermsCheck: false
                  UserRoleType: ISO
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Bad code or terms not accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Java MFA unavailable

  /totp/verify-setup:
    post:
      tags: [3. Authenticator]
      security: []
      summary: Confirm TOTP setup (enroll) and get JWT
      description: After verifyOTP QR step. Body id + email + 6-digit code.
      operationId: totpVerifySetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            examples:
              completeEnroll:
                value:
                  id: "a4b5a963-9f73-4894-a56a-08032f6d1d6a"
                  email: user@example.com
                  code: "391204"
                  isTermsCheck: true
                  UserRoleType: SYSTEM
      responses:
        '200':
          description: Enrollment complete + JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Email not done, wrong flow, or invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Terms not accepted when required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Java MFA unavailable

components:
  securitySchemes:
    PortalBearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: accessToken from login success. Not used on these MFA challenge routes.

    JavaMfaApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Portal-backend to Java MFA only (TOTP_API_KEY). Never for FE/Swagger.

  schemas:
    FingerPrintData:
      type: object
      required: [browserVersion, browserName, userAgent, screenResolution, cookies]
      properties:
        browserVersion: { type: string }
        browserName: { type: string }
        plugIn: { type: string, nullable: true }
        userAgent: { type: string }
        timeZone: { type: string, nullable: true }
        screenResolution: { type: string }
        cookies: { type: boolean }
        longitude: { type: number }
        latitude: { type: string }

    ValidateLoginRequest:
      type: object
      required: [email, password, fingerPrintData]
      properties:
        email:
          type: string
          format: email
          description: User email (identity for password check and later session binding)
        password:
          type: string
          description: Portal FE AES-encrypted password (LOGIN_TOKEN). This is the Stage-1 credential — not a Bearer token.
        captchaToken: { type: string, nullable: true }
        version: { type: string, nullable: true }
        fingerPrintData:
          $ref: '#/components/schemas/FingerPrintData'
        whitelabelData: {}

    ResendOtpRequest:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Pre-auth session UUID from `validateLogin` response.
            This is the Stage-2 binder (not a JWT). Must match an active session for `email`.
        email:
          type: string
          format: email
          description: Must match the email on the pre-auth session
        whitelabelData: {}

    VerifyOtpRequest:
      type: object
      required: [otp, id, email, isTermsCheck, UserRoleType]
      properties:
        otp:
          type: string
          description: Email OTP from legacy AUTH generateAuthCode flow (Stage-3 factor for enroll / legacy)
        id:
          type: string
          format: uuid
          description: Pre-auth session UUID from validateLogin (required; no Authorization header)
        email: { type: string, format: email }
        isTermsCheck:
          oneOf:
            - { type: boolean }
            - { type: integer, enum: [0, 1] }
          description: For TOTP ENROLL, terms are skipped server-side on this call
        UserRoleType: { type: string, example: SYSTEM }
        whitelabelData: {}

    TotpCodeRequest:
      type: object
      required: [id, email, code]
      properties:
        id:
          type: string
          format: uuid
          description: Pre-auth session UUID from validateLogin (required; no Authorization header)
        email:
          type: string
          format: email
          description: Must match the pre-auth session email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          description: Authenticator TOTP only — exactly 6 digits (no backup codes). Stage-3 factor.
        isTermsCheck:
          oneOf:
            - { type: boolean }
            - { type: integer, enum: [0, 1] }
          description: Must be true when TERMS_ALLOW_USERS includes UserRoleType and terms not yet accepted
        UserRoleType: { type: string, example: SYSTEM }

    TotpVerificationRequiredResponse:
      type: object
      description: Next → POST /totp/verify. Copy `id` into that request body.
      required: [totpVerificationRequired, id, email]
      properties:
        totpVerificationRequired: { type: boolean, enum: [true] }
        mfaRequired: { type: boolean }
        mfa: { type: boolean }
        id:
          type: string
          format: uuid
          description: Pre-auth session id — required on /totp/verify
        email: { type: string, format: email }
        userType: { type: string }
        isTermsCheck: { type: boolean }
        phoneNumber: { type: string }

    TotpEnrollmentRequiredResponse:
      type: object
      description: Next → POST /verifyOTP (email), then /totp/verify-setup. Copy `id` forward.
      required: [totpEnrollmentRequired, id, email]
      properties:
        totpEnrollmentRequired: { type: boolean, enum: [true] }
        mfaRequired: { type: boolean }
        mfa: { type: boolean }
        id:
          type: string
          format: uuid
          description: Pre-auth ENROLL session id
        email: { type: string, format: email }
        userType: { type: string }
        isTermsCheck: { type: boolean }
        phoneNumber: { type: string }

    TotpEnrollmentPendingResponse:
      type: object
      description: Next → scan QR → POST /totp/verify-setup (same `id`)
      required: [totpEnrollmentPending, totpSetup, id]
      properties:
        emailOtpVerified: { type: boolean, enum: [true] }
        totpEnrollmentPending: { type: boolean, enum: [true] }
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        userType: { type: string }
        totpSetup:
          $ref: '#/components/schemas/TotpSetupPayload'

    TotpSetupPayload:
      type: object
      properties:
        qrCode:
          type: string
          description: QR image payload (often data URL)
        manualEntryKey: { type: string }
        otpauthUrl: { type: string }

    LegacyMfaRequiredResponse:
      type: object
      description: Non-TOTP legacy email/SMS MFA
      properties:
        mfaRequired: { type: boolean }
        id:
          type: string
          format: uuid
          description: Pre-auth session id for verifyOTP / resendOTP
        email: { type: string, format: email }
        phoneNumber: { type: string }

    LoginSuccessResponse:
      type: object
      description: |
        users.login() success payload (shape varies by role).
        Use `accessToken` as Bearer JWT on other portal APIs — not on these MFA challenge routes.
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT for authenticated portal APIs after MFA completes. Do not send back to /v1/mfa challenge endpoints.
        userType: { type: string }
        email: { type: string, format: email }
        excludeFeatures:
          type: array
          items: { type: string }
        roleFeatures:
          type: array
          items: { type: object }
      additionalProperties: true

    ErrorMessage:
      type: object
      properties:
        message: { type: string }
        type: { type: string }
        attemptsRemaining: { type: integer }
        code: { type: string }

    RateLimitError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: You've made too many attempts in a short period of time, please try again

  examples: {}

x-flow-summary:
  enrolled: |
    validateLogin → totp/verify → JWT
  enroll: |
    validateLogin → verifyOTP → totp/verify-setup → JWT
  authentication: |
    No Bearer on MFA routes. Body id+email after validateLogin. accessToken only after success.
  rateLimits:
    LOGIN_RATE_LIMIT: "5,5,300 on validateLogin"
    RETRY_RATE_LIMIT: "20,60,120 on resendOTP, verifyOTP, totp/verify, totp/verify-setup"
